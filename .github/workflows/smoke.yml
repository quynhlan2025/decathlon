name: Smoke Tests

on:
  push:
    branches: [main, dev, release/**]
  pull_request:
    branches: [main, dev]

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke — ${{ matrix.region }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        region: [SG, VN]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests — ${{ matrix.region }}
        env:
          ENV: prod
          CI: true
          WORKERS: 4
        run: |
          npx playwright test \
            --project=${{ matrix.region }} \
            --grep "@smoke|@p0" \
            --reporter=github,html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ matrix.region }}
          path: playwright-report/
          retention-days: 7
